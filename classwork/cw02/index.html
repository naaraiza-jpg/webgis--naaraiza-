<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoenix Cool Spots</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <!-- Header contains the app title and navigation. -->
        <img src="phoenix.png" alt="Phoenix icon">

        <h1>Phoenix Cool Spots</h1>

        <nav>
            <a href="#">Maps</a>
            <a href="#">About</a>
        </nav>

    </header>

    <main>

        <aside>

            <label>
                <input type="checkbox">
                Shade Trees
            </label>

            <label>
                <input type="checkbox">
                Water Stations
            </label>

            <label>
                <input type="checkbox">
                Cooling Centers
            </label>

            <p>
                Data source:
                <a href="https://www.phoenix.gov/" target="_blank">
                    City of Phoenix
                </a>
            </p>

        </aside>

        <div class="map-wrapper">

            <div id="map">
                MAP GOES HERE
            </div>

            <button class="map-control">+</button>

        </div>

    </main>

    <footer>
        Phoenix Cool Spots
    </footer>

</body>

</html>
