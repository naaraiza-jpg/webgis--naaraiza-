
<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <title>Legend component card style | Sample | ArcGIS Maps SDK for JavaScript</title>

        <!-- Load Calcite components from CDN -->
        <script type="module" src="https://js.arcgis.com/calcite-components/3.3.3/calcite.esm.js"></script>

        <!-- Load ArcGIS Maps SDK for JavaScript -->
        <script src="https://js.arcgis.com/4.34/"></script>

        <!-- Load Map components -->
        <script type="module" src="https://js.arcgis.com/4.34/map-components/"></script>

        <style>
            html,
            body {
                margin: 0;
            }

            arcgis-map {
                display: block;
                height: 100vh;
            }
        </style>
    </head>

    <body>
        <!-- Map component displays the web map -->
        <arcgis-map item-id="10f5128431d44f9180d9936834100ac5"
            basemap="gray-vector" zoom="8" center="-99.17, 19.4">

            <!-- Zoom component -->
            <arcgis-zoom slot="top-left"></arcgis-zoom>

            <!-- Legend component -->
            <arcgis-legend legend-style="card" slot="bottom-left"></arcgis-legend>
        </arcgis-map>

        <script type="module">
            // Load the ArcGIS configuration module
            const esriConfig = await $arcgis.import("@arcgis/core/config.js");

            // API key commented out per professor's instructions
            // esriConfig.apiKey = "YOUR_API_KEY";
        </script>
    </body>
</html>
