
<!DOCTYPE html>
<html lang="en">
<head>
   
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Corridors | Shaded routes to cooling centers in Tempe</title>
    <meta name="description" content="Cool Corridors is a Tempe volunteer group that records shade along routes between bus stops and cooling centers.">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js" defer></script>
</head>

</head>
<body class="app">

    <header>
        <a class="brand" href="index.html">
            <img src="images/logo.svg" alt="Cool Corridors logo">
            <span>Cool Corridors</span>
        </a>

        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="map.html" aria-current="page">Map</a>
            <a href="index.html#signup">Sign up</a>
        </nav>
    </header>

    <main>
        <h1>Cool Corridors Map</h1>

        <aside>
            <h2>Map layers</h2>

           
<label>
    <input type="checkbox" id="shaded-routes" name="shaded-routes" checked>
    Shaded routes
</label>

<label>
    <input type="checkbox" id="cooling-centers" name="cooling-centers" checked>
    Cooling centers
</label>

<label>
    <input type="checkbox" id="bus-stops" name="bus-stops" checked>
    Bus stops
</label>

        </aside>

        <div class="map-wrapper">
            <div id="map">
                Map goes here
            </div>

            <button class="map-control" type="button">Locate me</button>
        </div>
    </main>

    <footer>
        <p>Cool Corridors is a volunteer project.</p>
    </footer>

</body>
</html>
